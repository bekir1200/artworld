<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071827">
  <meta name="robots" content="noindex">
  <title>Şifremi unuttum — Art World TV</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <aside class="login-panel" aria-label="Art World TV Yönetim Sistemi hakkında">
      <a class="login-brand" href="/" aria-label="Art World TV ana sayfa"><img src="assets/art-world-logo.png" alt="Art World TV"></a>
      <div class="login-panel-copy">
        <p class="login-panel-kicker">Yayın masası</p>
        <h2 class="login-panel-title">Art World TV<br>Yönetim Sistemi</h2>
        <p class="login-panel-text">Haber, röportaj ve yayın akışınızı tek ekrandan planlayın, yönetin ve yayımlayın.</p>
      </div>
      <p class="login-panel-foot">Yalnızca yetkili personel içindir.</p>
    </aside>
    <div class="login-main">
      <section class="login-card" aria-labelledby="forgot-title">
        <h1 id="forgot-title">Şifremi Unuttum</h1>
        <p class="login-intro">Hesabınızla ilişkili e-posta adresini girin. Kayıtlıysa parola sıfırlama bağlantısı gönderilir.</p>
        <form id="login-form" data-mode="forgot" novalidate>
          <label for="login-email">E-posta adresi</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required maxlength="254" autofocus>
          <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
          <button class="primary-action login-submit" type="submit">Bağlantı gönder</button>
        </form>
        <p class="login-intro" id="forgot-message" role="status" aria-live="polite" hidden></p>
        <p class="login-intro" id="forgot-note" hidden></p>
      </section>
      <a class="back-link" href="/giris">Giriş ekranına dön</a>
    </div>
  </main>
  <script src="password-reset.js" defer></script>
</body>
</html>
